name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  metadata-check:
    name: Release Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate repository metadata
        shell: bash
        run: |
          test -f LICENSE
          test -f manifest.json
          test -f package.json
          test -f versions.json

          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "manifest version: $MANIFEST_VERSION"
          echo "package version: $PACKAGE_VERSION"

          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "manifest.json and package.json versions are not synchronized"
            exit 1
          fi

          node -e "const versions=require('./versions.json'); const version=process.argv[1]; if (!versions[version]) { console.error('versions.json missing version ' + version); process.exit(1); }" "$MANIFEST_VERSION"

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Validate marketplace assets
        shell: bash
        run: |
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css

          DIST_MANIFEST_VERSION=$(node -p "require('./dist/manifest.json').version")
          SOURCE_MANIFEST_VERSION=$(node -p "require('./manifest.json').version")

          if [ "$DIST_MANIFEST_VERSION" != "$SOURCE_MANIFEST_VERSION" ]; then
            echo "dist/manifest.json version does not match manifest.json"
            exit 1
          fi

          MAIN_JS_SIZE=$(stat -c%s "dist/main.js" 2>/dev/null || stat -f%z "dist/main.js")
          STYLES_SIZE=$(stat -c%s "dist/styles.css" 2>/dev/null || stat -f%z "dist/styles.css")

          echo "main.js size: $MAIN_JS_SIZE bytes"
          echo "styles.css size: $STYLES_SIZE bytes"

          if [ "$MAIN_JS_SIZE" -gt 5242880 ]; then
            echo "main.js exceeds the 5 MB Obsidian Sync Standard threshold"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          retention-days: 7

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [metadata-check, build]
    if: always()
    steps:
      - name: Check all jobs status
        shell: bash
        run: |
          echo "CI Pipeline Summary"
          echo "==================="
          echo "Release Metadata Check: ${{ needs.metadata-check.result }}"
          echo "Build Verification: ${{ needs.build.result }}"

          if [[ "${{ needs.metadata-check.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "CI Pipeline Failed"
            exit 1
          fi

          echo "All Checks Passed"
