name: Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  marketplace-quality-gate:
    name: Marketplace Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate metadata consistency
        id: metadata
        shell: bash
        run: |
          test -f LICENSE
          test -f manifest.json
          test -f package.json
          test -f versions.json
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "manifest_version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "manifest.json and package.json versions are not synchronized"
            exit 1
          fi

          node -e "const versions=require('./versions.json'); const version=process.argv[1]; if (!versions[version]) { console.error('versions.json missing version ' + version); process.exit(1); }" "$MANIFEST_VERSION"

      - name: Build and verify marketplace payload
        id: build
        shell: bash
        run: |
          npm run build

          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css

          DIST_MANIFEST_VERSION=$(node -p "require('./dist/manifest.json').version")
          SOURCE_MANIFEST_VERSION=$(node -p "require('./manifest.json').version")

          if [ "$DIST_MANIFEST_VERSION" != "$SOURCE_MANIFEST_VERSION" ]; then
            echo "dist/manifest.json version does not match manifest.json"
            exit 1
          fi

          MAIN_JS_SIZE=$(stat -c%s "dist/main.js" 2>/dev/null || stat -f%z "dist/main.js")
          STYLES_SIZE=$(stat -c%s "dist/styles.css" 2>/dev/null || stat -f%z "dist/styles.css")
          MAIN_JS_MB=$(node -e "console.log((require('fs').statSync('dist/main.js').size / 1048576).toFixed(2))")

          echo "main_js_size=$MAIN_JS_SIZE" >> "$GITHUB_OUTPUT"
          echo "styles_size=$STYLES_SIZE" >> "$GITHUB_OUTPUT"
          echo "main_js_mb=$MAIN_JS_MB" >> "$GITHUB_OUTPUT"

          if [ "$MAIN_JS_SIZE" -gt 5242880 ]; then
            echo "main.js exceeds the 5 MB Obsidian Sync Standard threshold"
            exit 1
          fi

      - name: Generate quality report
        if: always()
        shell: bash
        run: |
          cat > quality-report.md << EOF
          # Marketplace Quality Gate Report

          | Check | Status | Value |
          |---|---|---|
          | License present | ✅ | LICENSE |
          | Version consistency | ✅ | ${{ steps.metadata.outputs.manifest_version }} |
          | Build output | ✅ | dist/main.js, dist/manifest.json, dist/styles.css |
          | main.js size | ✅ | ${{ steps.build.outputs.main_js_mb }} MB |

          This gate is intentionally focused on the release payload required by the Obsidian marketplace.
          EOF

          cat quality-report.md

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quality-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
