name: Test Report

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with detailed output
        run: npm run test -- --reporter=verbose --reporter=json --outputFile=test-results.json
        continue-on-error: true

      - name: Generate test summary
        if: always()
        shell: bash
        run: |
          rm -f test-summary.md
          echo "# Test Execution Report" > test-summary.md
          echo "" >> test-summary.md
          echo "## Test Results" >> test-summary.md
          echo "" >> test-summary.md

          if [ -f "test-results.json" ]; then
            TOTAL=$(jq '.numTotalTests' test-results.json || echo 0)
            PASSED=$(jq '.numPassedTests' test-results.json || echo 0)
            FAILED=$(jq '.numFailedTests' test-results.json || echo 0)

            echo "- **Total Tests**: $TOTAL" >> test-summary.md
            echo "- **Passed**: $PASSED" >> test-summary.md
            echo "- **Failed**: $FAILED" >> test-summary.md
            echo "" >> test-summary.md

            if [ "$FAILED" -gt 0 ]; then
              echo "## Failed Tests" >> test-summary.md
              echo "" >> test-summary.md
              jq -r '.testResults[] | select(.status == "failed") | "- \(.name)"' test-results.json >> test-summary.md || true
            fi
          else
            echo "Test results not available" >> test-summary.md
          fi

          cat test-summary.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results.json
            test-summary.md
            coverage/
          retention-days: 30
