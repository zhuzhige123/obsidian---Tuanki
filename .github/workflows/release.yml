name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Build And Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Read release version
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLIC_VERSIONS_JSON=$(node -p "JSON.stringify(require('./public/versions.json'))")
          ROOT_VERSIONS_JSON=$(node -p "JSON.stringify(require('./versions.json'))")

          echo "tag=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json ($PACKAGE_VERSION)"
            exit 1
          fi

          node -e "const pub=require('./public/versions.json'); const root=require('./versions.json'); const version=process.argv[1]; if (!pub[version]) { console.error('public/versions.json missing version ' + version); process.exit(1); } if (!root[version]) { console.error('versions.json missing version ' + version); process.exit(1); } if (JSON.stringify(pub) !== JSON.stringify(root)) { console.error('Root versions.json is not synchronized with public/versions.json'); process.exit(1); }" "$TAG_VERSION"

      - name: Build plugin
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          OBSIDIAN_VAULT_PATH: ""
        run: npm run build

      - name: Verify release assets
        shell: bash
        run: |
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css

      - name: Attest main.js
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/main.js

      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/manifest.json

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Weave ${{ steps.version.outputs.manifest }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
